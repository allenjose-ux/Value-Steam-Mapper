<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stream mapper: build a value stream map step by step</title>
<meta name="description" content="Build a value stream map step by step, find where work waits, and size the fixes before you commit to them.">
<meta name="theme-color" content="#17324D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317324D'/%3E%3Cpath d='M6 20h6l3-8 3 8h8' fill='none' stroke='%234CC9C0' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBF0F4;--surface:#FFFFFF;--ink:#12202E;--muted:#566677;--line:#D2DBE3;
  --primary:#17324D;--onprimary:#FFFFFF;--focus:#1B6FD1;
  --va:#0F8B8D;--va-bg:#D8F0EF;--req:#5E74A0;--req-bg:#E1E7F2;--waste:#D4483E;--waste-bg:#FBE0DD;
  --wait:#D99A0B;--wait-bg:#FBEAC5;--imp:#2A9457;--imp-bg:#D8F1E1;--imp-text:#1A7440;
  --ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:"Bricolage Grotesque","Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1923;--surface:#162331;--ink:#E5ECF2;--muted:#95A6B6;--line:#2A3B4C;
    --primary:#9CC4F0;--onprimary:#0E1923;--focus:#6FA8F0;
    --va:#4CC9C0;--va-bg:#12393B;--req:#8CA3CC;--req-bg:#25314A;--waste:#F0766C;--waste-bg:#4A2326;
    --wait:#F0B93A;--wait-bg:#4A3A12;--imp:#4FCB82;--imp-bg:#173A29;--imp-text:#6FDB9B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1923;--surface:#162331;--ink:#E5ECF2;--muted:#95A6B6;--line:#2A3B4C;
  --primary:#9CC4F0;--onprimary:#0E1923;--focus:#6FA8F0;
  --va:#4CC9C0;--va-bg:#12393B;--req:#8CA3CC;--req-bg:#25314A;--waste:#F0766C;--waste-bg:#4A2326;
  --wait:#F0B93A;--wait-bg:#4A3A12;--imp:#4FCB82;--imp-bg:#173A29;--imp-text:#6FDB9B;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--ui);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.shell{max-width:1320px;margin:0 auto;padding:20px clamp(12px,3vw,32px) 56px}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.2}
h1{font-size:clamp(26px,3.4vw,34px)}
h2{font-size:22px;margin-bottom:6px}
h3{font-size:16px;margin:18px 0 8px}
p{margin:0 0 10px}
.mut{color:var(--muted)}
.lead{color:var(--muted);margin-bottom:16px}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
small{color:var(--muted);font-size:12.5px;display:block;margin-top:4px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.tag{color:var(--muted);margin:6px 0 0;max-width:62ch}
.reset{display:flex;align-items:center;gap:8px;font-size:14px}
.btn{font:500 14px var(--ui);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.stages{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.stg{font:500 14px var(--ui);background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 12px 9px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.stg .n{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:inline-grid;place-items:center;font-size:12px}
.stg.done .n{background:var(--va);border-color:var(--va);color:#fff}
.stg[aria-current="step"]{color:var(--ink);border-bottom-color:var(--primary)}
.stg:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:minmax(0,410px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.card{margin-bottom:16px}
.card h3:first-child{margin-top:0}
.f{display:block;margin:0 0 14px;border:0;padding:0;min-width:0}
.f>span,.lbl,legend{display:block;font-weight:500;font-size:14px;margin-bottom:6px;padding:0}
input,select,textarea{font:400 15px var(--ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input[type=range]{padding:0;accent-color:var(--primary);height:24px}
input[type=checkbox],input[type=radio]{width:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:2fr 1.4fr 1fr;gap:10px}
@media (max-width:520px){.row2,.row3{grid-template-columns:1fr}}
.num{display:flex;align-items:center;gap:8px}
.num em{font-style:normal;color:var(--muted);font-size:14px;min-width:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font:400 13px var(--ui);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip.on{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink);padding:8px 13px;font:500 13px var(--ui);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--primary);color:var(--onprimary)}
.tpl{background:var(--bg);border-radius:10px;padding:12px 14px;margin-bottom:18px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.srow{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--surface)}
.srow.sel{border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
.sbtn{flex:1;min-width:0;text-align:left;border:0;background:transparent;color:var(--ink);padding:9px 10px;cursor:pointer;display:grid;grid-template-columns:12px minmax(0,1fr);column-gap:8px;align-items:center;font:inherit}
.sname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smeta{grid-column:2;color:var(--muted);font-size:12.5px}
.sact{display:flex;align-items:center;gap:2px;padding-right:6px}
.sact button,.x{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:16px}
.sact button:hover,.x:hover{background:var(--bg);color:var(--ink)}
.sact button:disabled{opacity:.3;cursor:default}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.va{background:var(--va)}.dot.req{background:var(--req)}.dot.waste{background:var(--waste)}
.editor{margin-top:16px;padding-top:4px;border-top:1px dashed var(--line)}
.insight{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:6px}
.insight p:last-child{margin:0}
.radio{display:flex;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;align-items:flex-start}
.radio input{margin-top:4px}
.radio:has(input:checked){border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
.radio b{font-weight:500;display:block}
.sug{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.sug b{font-weight:500;display:block}
.sug span{color:var(--muted);font-size:13px;display:block}
.imp{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.imp.off{opacity:.55}
.imphead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.imphead .imptitle{font-weight:500}
.chk input{width:18px;height:18px;margin:0}
.sl{display:grid;grid-template-columns:132px minmax(0,1fr);gap:4px 10px;align-items:center;margin-bottom:6px;font-size:13.5px}
.sl output{grid-column:2;color:var(--muted);font-size:12.5px}
.sl input:disabled{opacity:.35}
.saves{font-size:13.5px;font-weight:500;color:var(--imp-text);margin-top:4px}
.imp.off .saves{color:var(--muted)}
.total{background:var(--imp-bg);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.tri{width:0;height:0;border-radius:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--wait);vertical-align:0}
.kstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.kstrip>div{padding:12px 16px;border-right:1px solid var(--line)}
.kstrip>div:last-child{border-right:0}
.kstrip span{display:block;color:var(--muted);font-size:12.5px}
.kstrip b{font:600 22px var(--display);display:block;line-height:1.2}
.good{color:var(--imp-text)}.bad{color:var(--waste)}
@media (max-width:560px){.kstrip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scroll{overflow-x:auto;padding:12px 16px 16px}
.maphead{position:sticky;left:0;font:600 14px var(--display);margin:4px 0 6px}
.maphead+svg{margin-bottom:14px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.ghost{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:16px}
.ghost i{width:86px;height:52px;border:1.5px dashed var(--line);border-radius:6px}
.ghost u{width:22px;height:0;border-top:1.5px dashed var(--line)}
.vsm{display:block}
.vsm text{fill:var(--ink);font:400 12px var(--ui);dominant-baseline:central}
.vsm .t{font-weight:600;font-size:13px}
.vsm .mut{fill:var(--muted)}
.vsm .hd{stroke-width:1.5}
.hd.va{fill:var(--va-bg);stroke:var(--va)}.hd.req{fill:var(--req-bg);stroke:var(--req)}.hd.waste{fill:var(--waste-bg);stroke:var(--waste)}
.dbox,.nbox{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.q{fill:var(--wait-bg);stroke:var(--wait);stroke-width:1.5}
.q.hot{fill:var(--wait)}
.q.none{fill:none;stroke-dasharray:3 3;opacity:.5}
.elim{stroke-dasharray:4 3;opacity:.6}
.vsm .strike{text-decoration:line-through}
.vsm .gain{fill:var(--imp-text);font-weight:600}
.pill{fill:var(--imp-bg);stroke:var(--imp);stroke-width:1}
.lw{stroke:var(--wait);stroke-width:3;stroke-linecap:round}
.lt{stroke-width:3;stroke-linecap:round}
.lt.va{stroke:var(--va)}.lt.req{stroke:var(--req)}.lt.waste{stroke:var(--waste)}
.lv{stroke:var(--line);stroke-width:1.5}
.ar{stroke:var(--muted);stroke-width:1.5;fill:none}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{display:block;color:var(--muted);font-size:13px}
.kpi b{font:600 26px var(--display);display:block;line-height:1.2;margin:2px 0}
.kpi b i{font-style:normal;font-size:15px;color:var(--muted);font-weight:500}
.kpi small{margin:0}
.crow{display:grid;grid-template-columns:64px minmax(0,1fr) 84px;align-items:center;gap:10px;margin-bottom:8px}
.ctrack{background:var(--bg);border-radius:6px;height:36px;overflow:hidden}
.cbar{display:flex;height:100%}
.cbar>div{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:500;min-width:0;overflow:hidden;border-bottom:4px solid}
.s-wait{background:var(--wait-bg);border-color:var(--wait)}.s-va{background:var(--va-bg);border-color:var(--va)}
.s-req{background:var(--req-bg);border-color:var(--req)}.s-waste{background:var(--waste-bg);border-color:var(--waste)}
.wf{display:grid;gap:6px}
.wrow{display:grid;grid-template-columns:minmax(120px,230px) minmax(0,1fr) 92px;gap:12px;align-items:center}
.wl b{font-weight:500;display:block;line-height:1.3}
.wl span{color:var(--muted);font-size:12.5px}
.wt{position:relative;height:22px;background:var(--bg);border-radius:4px}
.wbar{position:absolute;top:0;height:100%;border-radius:4px}
.wbar.base{background:var(--req)}.wbar.sav{background:var(--imp)}.wbar.fut{background:var(--va)}
.wv{text-align:right;font-weight:500;font-size:14px}
@media (max-width:640px){.wrow{grid-template-columns:minmax(0,1fr) 80px}.wrow .wt{grid-column:1/-1;order:3}}
textarea{min-height:200px;font:400 13.5px/1.5 var(--ui);resize:vertical}
.copyrow{display:flex;gap:10px;align-items:center;margin-top:10px}
.refwrap{margin-bottom:16px}
.refs{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.refs>summary{cursor:pointer;padding:11px 14px;font-weight:500;display:flex;align-items:center;gap:8px;list-style:none}
.refs>summary::-webkit-details-marker{display:none}
.refs>summary::before{content:"▸";color:var(--muted)}
.refs[open]>summary::before{content:"▾"}
.count{background:var(--bg);border-radius:999px;font-size:12px;padding:1px 8px;color:var(--muted);font-weight:400}
.refbody{padding:0 14px 14px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;margin-bottom:10px}
.drop.over{border-color:var(--primary);background:var(--bg)}
.drop p{margin:0 0 8px;color:var(--muted)}
.drop small{margin-top:8px}
.paste{margin-bottom:10px;font-size:14px}
.paste summary{cursor:pointer;color:var(--muted);margin-bottom:6px}
.paste textarea{min-height:90px;margin-bottom:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.dtop{display:flex;align-items:center;gap:8px}
.dname{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmeta{color:var(--muted);font-size:12.5px;white-space:nowrap}
.doc details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:4px}
.doc pre{white-space:pre-wrap;word-break:break-word;font:400 12.5px/1.5 var(--ui);background:var(--bg);border-radius:6px;padding:8px;max-height:160px;overflow:auto;margin:6px 0 0}
.draft{background:var(--bg);border-radius:10px;padding:12px 14px;margin:10px 0}
.draft ol{margin:6px 0;padding-left:20px}
.aibar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.aimsg{font-size:13.5px;color:var(--muted)}
.aimsg.err{color:var(--waste)}
.aimsg:empty{display:none}
.ask{margin-top:12px}
.askout{white-space:pre-wrap;font-size:14px;margin-top:6px}
.src{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:13.5px;margin:0 0 14px}
.src b{font-weight:500;display:block}
.src p{margin:2px 0 0;color:var(--muted)}
.warn,small.warn{color:var(--waste)}
.badge{font-style:normal;font-size:11.5px;font-weight:500;background:var(--va-bg);color:var(--ink);border:1px solid var(--va);border-radius:999px;padding:0 7px;margin-right:4px;display:inline-block}
.srcq{font-style:italic}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin-right:6px;vertical-align:-2px}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.chip,.btn,.seg button{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Stream mapper needs JavaScript. Turn it on in your browser and reload.</p></noscript>
<script>
(function(){
'use strict';
const KEY='stream-mapper-v1';
const STANDALONE=!(window.claude&&window.claude.use);
const CFG_KEY='stream-mapper-ai';
const DEFEND='https://api.anthropic.com',DEFMODEL='claude-sonnet-5-5';
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const num=v=>{const n=parseFloat(v);return isFinite(n)&&n>=0?n:0};
const fmt=n=>{if(!isFinite(n))return '—';const d=Math.abs(n)<1?100:10;return String(Math.round(n*d)/d)};
const clip=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const pct=(a,b)=>b?a/b*100:0;

const CAUSES=['Batching','Approval','Handoff','Capacity','System or tool','Scheduling','Other'];
const LOSSES=['Missing information','Quality error','Rejected or declined','Drop-out or no-show','Other'];
const LEVERS=['Eliminate','Automate','Reduce batching','Standardize','Redesign handoff','Add capacity','Other'];
const EFFORTS=['Low','Medium','High'];
const CLSN={va:'Yes, it adds value',req:'Needed, but adds no value',waste:'No, it’s waste'};
const CLSD={va:'The customer would pay for it, or notice if it were missing.',req:'Compliance, security, or a handoff the work depends on.',waste:'Rework, waiting for approval, duplicate checks.'};
const SUG={
  'Batching':{title:'Move from batches to continuous flow',lever:'Reduce batching',waitCut:60,effort:'Medium'},
  'Approval':{title:'Delegate approval and set a response SLA',lever:'Redesign handoff',waitCut:60,effort:'Low'},
  'Handoff':{title:'Give the work one owner end to end',lever:'Redesign handoff',waitCut:50,effort:'Medium'},
  'Capacity':{title:'Rebalance capacity with a flex pool',lever:'Add capacity',waitCut:40,effort:'Medium'},
  'System or tool':{title:'Integrate or automate the system step',lever:'Automate',waitCut:30,touchCut:40,effort:'High'},
  'Scheduling':{title:'Pre-book slots or let people self-schedule',lever:'Standardize',waitCut:60,effort:'Low'},
  'Other':{title:'Agree a time limit and escalate when it’s breached',lever:'Standardize',waitCut:30,effort:'Low'}
};

const fresh=()=>({stage:1,view:'current',sel:null,reset:false,scope:{name:'',account:'',unit:'d',input:'',output:'',demand:'',per:'month'},steps:[],imps:[],docs:[]});
function load(){try{const r=localStorage.getItem(KEY);if(!r)return null;const o=JSON.parse(r);if(!o||!Array.isArray(o.steps)||!Array.isArray(o.imps))return null;const f=fresh();return Object.assign(f,o,{scope:Object.assign(f.scope,o.scope||{}),reset:false,docs:Array.isArray(o.docs)?o.docs:[]});}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load()||fresh();
const app=$('#app');

const newStep=o=>Object.assign({id:uid(),name:'',owner:'',touch:0,wait:0,yield:100,cls:'req',cause:'',loss:'',note:'',src:'',missing:[]},o||{});
const newImp=o=>Object.assign({id:uid(),stepId:null,title:'',lever:'Other',waitCut:0,touchCut:0,yieldGain:0,effort:'Low',on:true},o||{});

const TPL={
  hiring:{scope:{name:'Recruitment to training',account:'Voice account',unit:'d',input:'applicants',output:'agent',demand:'40',per:'month'},

function parseJsonReply(text,truncated){

function makeSample(cfg){

<h2>Steps</h2><table><thead><tr><th>#</th><th>Step</th><th>Owner</th><th>Value type</th><th class="n">Hands-on</th><th class="n">Wait before</th><th class="n">Right first time</th><th>Wait cause</th>${has?'<th class="n">Future hands-on</th><th class="n">Future wait</th><th class="n">Future right first time</th>':''}</tr></thead><tbody>${sRows}</tbody></table>
${iRows?`<h2>Improvements</h2><table><thead><tr><th>Change</th><th>Step</th><th>Type</th><th>Effort</th><th class="n">Time saved</th><th class="n">Quality</th></tr></thead><tbody>${iRows}</tbody></table>`:''}
${S.docs.length?`<h2>Reference documents</h2><p>${S.docs.map(d=>esc(d.name)).join(', ')}</p>`:''}
</body></html>`;
}
function dlHTML(){
  if(DL===false)return `<h3>Download</h3><p class="hint" style="margin:0">Downloads aren’t available in this view. Copy the summary at the bottom of the page instead.</p>`;
  const off=DL?'':'disabled';
  return `<h3>Download your map</h3><div class="chips" style="margin-top:10px"><button type="button" class="btn primary" data-action="dl" data-v="report" ${off}>Report (.html)</button><button type="button" class="btn" data-action="dl" data-v="png" ${off}>Map image (.png)</button><button type="button" class="btn" data-action="dl" data-v="csv" ${off}>Data (.csv)</button></div><small>The report opens in any browser and prints cleanly to PDF. The CSV opens in Excel.</small><p class="hint" id="dlMsg" role="status"></p>`;
}
function renderDl(){const c=$('#dlCard');if(c)c.innerHTML=dlHTML()}
async function exportFile(kind){
  const m=$('#dlMsg'),say=t=>{const e=$('#dlMsg');if(e)e.textContent=t};
  if(!DL)return;
  try{
    say('Preparing…');
    const base=slug(S.scope.name);
    if(kind==='report')await DL.save({filename:base+'-report.html',data:reportHTML()});
    else if(kind==='csv')await DL.save({filename:base+'-data.csv',data:csvText()});
    else{const c=compositeSVG(),blob=await svgToPng(c.svg,c.w,c.h);await DL.save({filename:base+'-map.png',data:blob})}
    say('Saved.');
  }catch(e){
    const c=e&&e.code;
    say(c==='declined'?'Download cancelled.':c==='too_large'?'That file is too large to save.':'Couldn’t save this file. Try another format.');
  }
}

function resultsHTML(){
  const u=U(),cur=model(false),fut=model(true),mc=metrics(cur),mf=metrics(fut),has=S.imps.some(i=>i.on);
  const comp=[['wait','Waiting',mc.wait,mf.wait],['va','Adds value',mc.va,mf.va],['req','Needed, no value',mc.req,mf.req],['waste','Waste',mc.waste,mf.waste]];
  return `<div class="card"><h2>${esc(S.scope.name||'Your value stream')}</h2><p class="lead" style="margin:0">${headline(mc,mf,has)}</p></div>
<div class="card" id="dlCard">${dlHTML()}</div>
<div class="kgrid">${kpiCards(mc,mf,has)}</div>
<section class="card"><h3>Where the time goes</h3>
<div class="crow"><span>Current</span><div class="ctrack">${bar(cur,mc.lead)}</div><span>${fmt(mc.lead)} ${u}</span></div>
${has?`<div class="crow"><span>Future</span><div class="ctrack">${bar(fut,mc.lead)}</div><span>${fmt(mf.lead)} ${u}</span></div>`:''}
<div class="legend" style="margin-top:10px">${comp.map(c=>`<span><i style="background:var(--${c[0]})"></i>${c[1]} ${fmt(pct(c[2],mc.lead))}%${has?' → '+fmt(pct(c[3],mf.lead))+'%':''}</span>`).join('')}</div></section>
<section class="card"><h3>What each improvement is worth</h3>${waterfall(mc,mf,fut)}</section>
<section class="card"><h3>Maps</h3><div class="scroll" style="padding:0"><div class="maphead">Current state</div>${mapSVG(cur)}${has?`<div class="maphead">Future state</div>${mapSVG(fut)}`:''}</div></section>
<section class="card"><h3>Summary to share</h3><textarea id="sumTxt" readonly aria-label="Summary text">${esc(summaryText())}</textarea><div class="copyrow"><button type="button" class="btn primary" data-action="copy" id="copyBtn">Copy summary</button><span class="hint" id="copyMsg" style="margin:0"></span></div></section>
<div class="nav" style="border:0;margin-top:4px"><button class="btn ghost" data-action="back">Back to improvements</button><span></span></div>`;
}

function renderPanel(){
  const p=$('#panel');if(!p)return;
  p.innerHTML=S.stage===1?p1():S.stage===2?p2():p3();
  if(S.stage===3)renderStage3Lists();
  paintMsg();syncAi();
}
function renderApp(){
  app.innerHTML=topHTML()+stagesHTML()+(S.stage===4?`<div id="results">${resultsHTML()}</div>`:`<div class="grid"><section class="panel" id="panel"></section><div id="mapPane"></div></div>`);
  if(S.stage!==4){renderPanel();renderMapPane()}
}
function go(v){
  if(v>=3&&!S.steps.length)v=2;
  S.stage=v;REFS_OPEN=null;
  S.view=v===3&&S.imps.some(i=>i.on)?'future':'current';
  save();renderApp();
  try{window.scrollTo({top:0})}catch(e){}
}

function refreshStage2(){
  const s=sel();save();
  const l=$('#stepList');if(l)l.innerHTML=stepRowsHTML();
  if(s){const cb=$('#causeBlock');if(cb)cb.hidden=!(s.wait>0);const lb=$('#lossBlock');if(lb)lb.hidden=!(s.yield<90);const ins=$('#insight');if(ins)ins.innerHTML=insightHTML(s);document.querySelectorAll('[data-missfor]').forEach(e=>{e.hidden=!(s.missing||[]).includes(e.dataset.missfor)})}
  renderMapPane();
}

function onInput(e){
  const t=e.target,b=t.dataset&&t.dataset.bind;if(!b)return;
  const parts=b.split('.'),kind=parts[0],key=parts[1];
  if(kind==='scope'){S.scope[key]=t.value;save();renderMapPane();return}
  if(kind==='step'){
    const s=sel();if(!s)return;
    if(key==='cls'){if(!t.checked)return;s.cls=t.value}
    else if(key==='touch'||key==='wait')s[key]=num(t.value);
    else if(key==='yield'){s.yield=Math.max(1,Math.min(100,parseInt(t.value,10)||100));const yv=$('#yv');if(yv)yv.textContent=s.yield+'%'}
    else s[key]=t.value;
    if((key==='touch'||key==='wait'||key==='yield')&&s.missing)s.missing=s.missing.filter(k=>k!==key);
    refreshStage2();return;
  }
  if(kind==='imp'){
    const i=S.imps.find(x=>x.id===t.dataset.id);if(!i)return;
    if(key==='on')i.on=t.checked;
    else if(key==='waitCut'||key==='touchCut'||key==='yieldGain')i[key]=+t.value;
    else if(key==='stepId'){if(i.stepId===t.value)return;i.stepId=t.value;save();renderStage3Lists();return}
    else i[key]=t.value;
    save();updateImpLive();
  }
}
app.addEventListener('input',onInput);
app.addEventListener('change',onInput);

async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);return true}
  catch(e){try{const ta=$('#sumTxt');ta.focus();ta.select();return document.execCommand('copy')}catch(e2){return false}}
}
app.addEventListener('click',async e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,v=el.dataset.v,id=el.dataset.id;
  switch(a){
    case 'stage':go(+v);break;
    case 'next':go(Math.min(4,S.stage+1));break;
    case 'back':go(Math.max(1,S.stage-1));break;
    case 'view':S.view=v;save();renderMapPane();break;
    case 'tpl':loadTpl(v);break;
    case 'unit':S.scope.unit=v;save();renderPanel();renderMapPane();break;
    case 'addStep':{const s=newStep();S.steps.push(s);S.sel=s.id;save();renderPanel();renderMapPane();setTimeout(()=>{const f=$('[data-bind="step.name"]');if(f)f.focus()},0);break}
    case 'selStep':S.sel=id;save();renderPanel();break;
    case 'up':case 'down':{const i=S.steps.findIndex(s=>s.id===id),j=a==='up'?i-1:i+1;if(i<0||j<0||j>=S.steps.length)break;const t=S.steps[i];S.steps[i]=S.steps[j];S.steps[j]=t;save();renderPanel();renderMapPane();break}
    case 'delStep':{S.steps=S.steps.filter(s=>s.id!==id);S.imps=S.imps.filter(i=>i.stepId!==id);if(S.sel===id)S.sel=null;ensureSel();save();renderPanel();renderMapPane();break}
    case 'chip':{const s=sel();if(!s)break;const k=el.dataset.k;s[k]=s[k]===v?'':v;el.parentNode.querySelectorAll('.chip').forEach(c=>{const on=c.dataset.v===s[k];c.classList.toggle('on',on);c.setAttribute('aria-pressed',on)});save();break}
    case 'addSug':{const g=SUGS[+el.dataset.i];if(!g)break;S.imps.push(newImp({stepId:g.stepId,title:g.title,lever:g.lever,waitCut:g.waitCut,touchCut:g.touchCut,yieldGain:g.yieldGain,effort:g.effort}));save();renderStage3Lists();break}
    case 'addImp':{if(!S.steps.length)break;S.imps.push(newImp({stepId:S.steps[0].id}));save();renderStage3Lists();setTimeout(()=>{const f=document.querySelectorAll('.imptitle');if(f.length)f[f.length-1].focus()},0);break}
    case 'delImp':S.imps=S.imps.filter(i=>i.id!==id);save();renderStage3Lists();break;
    case 'dl':exportFile(v);break;
    case 'saveCfg':{
      const key=($('#cfgKey').value||'').trim(),old=loadCfg();
      const cfg={key:key||(old&&old.key)||'',model:($('#cfgModel').value||'').trim()||DEFMODEL,endpoint:($('#cfgEnd').value||'').trim().replace(/\/+$/,'')||DEFEND,remember:$('#cfgRem').checked};
      if(!cfg.key&&cfg.endpoint===DEFEND){setMsg('Add an API key to connect.',false,true);break}
      storeCfg(cfg);AI.sample=makeSample(cfg);AI.imgs=true;setMsg('',false);
      if(S.stage===2||S.stage===3)renderPanel();else renderRefs();break}
    case 'rmCfg':{clearCfg();AI.sample=null;AI.imgs=false;DRAFT=null;AISUGS=[];LOOK=null;setMsg('',false);if(S.stage===2||S.stage===3)renderPanel();else renderRefs();break}
    case 'pick':{const f=$('#fileIn');if(f)f.click();break}
    case 'addText':{const ta=$('#pasteIn'),t=normText(ta&&ta.value);if(t.length<30){setMsg('Paste at least a few sentences.',false,true);break}S.docs.push({id:uid(),name:'Pasted text '+(S.docs.length+1),kind:'text',status:'ready',err:'',text:t.slice(0,MAXDOC),size:t.length,cut:t.length>MAXDOC});ta.value='';save();renderRefs();break}
    case 'rmDoc':S.docs=S.docs.filter(d=>d.id!==id);save();renderRefs();break;
    case 'draftMap':draftMap();break;
    case 'applyNew':applyDraft('new');break;
    case 'applyAdd':applyDraft('add');break;
    case 'discard':DRAFT=null;renderRefs();break;
    case 'ask':askDocs();break;
    case 'lookup':lookupStep();break;
    case 'applyLookup':applyLookup();break;
    case 'ideas':findIdeas();break;
    case 'addAiSug':{const g=AISUGS[+el.dataset.i];if(!g)break;S.imps.push(newImp({stepId:g.stepId,title:g.title,lever:g.lever,waitCut:g.waitCut,touchCut:g.touchCut,yieldGain:g.yieldGain,effort:g.effort}));save();renderStage3Lists();break}
    case 'stop':if(AI.ctl)AI.ctl.abort();break;
    case 'reset':S.reset=true;renderApp();break;
    case 'resetNo':S.reset=false;renderApp();break;
    case 'resetYes':{S=fresh();DRAFT=null;AISUGS=[];LOOK=null;AI.ans='';AI.q='';try{localStorage.removeItem(KEY)}catch(x){}renderApp();break}
    case 'copy':{const ok=await copyText($('#sumTxt').value),m=$('#copyMsg');if(m){m.textContent=ok?'Copied.':'Couldn’t copy automatically. Select the text and copy it.';setTimeout(()=>{m.textContent=''},2500)}break}
  }
});

app.addEventListener('change',e=>{if(e.target&&e.target.id==='fileIn'){addFiles(e.target.files);e.target.value=''}});
app.addEventListener('input',e=>{if(e.target&&e.target.id==='askIn')AI.q=e.target.value});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='askIn'){e.preventDefault();askDocs()}});
app.addEventListener('toggle',e=>{if(e.target&&e.target.id==='refsBox')REFS_OPEN=e.target.open},true);
app.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
app.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
app.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)}});

if(STANDALONE){DL=browserDL;const cfg=loadCfg();if(cfg){AI.sample=makeSample(cfg);AI.imgs=true}}
renderApp();
try{
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(d=>{DL=d||false;renderDl()}).catch(()=>{DL=false;renderDl()});
    window.claude.use('sample').then(sm=>{
      if(!sm)return null;
      AI.sample=sm;
      return sm.limits?sm.limits().catch(()=>null):null;
    }).then(l=>{
      if(!AI.sample)return;
      AI.imgs=!!(l&&l.images);
      if(S.stage===2||S.stage===3){if(!AI.busy)renderPanel()}else renderRefs();
    }).catch(()=>{});
  }
}catch(e){if(!DL)DL=false}
})();
</script>
